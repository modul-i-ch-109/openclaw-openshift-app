kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: claw
  labels:
    app: claw
    app.kubernetes.io/part-of: claw
spec:
  to:
    kind: Service
    name: claw
    weight: 100
  port:
    targetPort: 18789
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
