---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: claw-proxy-egress
  labels:
    app: claw
    app.kubernetes.io/part-of: claw
spec:
  podSelector:
    matchLabels:
      app: claw-proxy
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
      to:
        - namespaceSelector: {}
  policyTypes:
    - Egress
