---
kind: ConfigMap
apiVersion: v1
metadata:
  name: claw-kube-config
  labels:
    app: claw
data:
  config: |
    apiVersion: v1
    clusters:
    - cluster:
        server: ${OPENSHIFT_SERVER}
        insecure-skip-tls-verify: true
      name: target
    contexts:
    - context:
        cluster: target
        namespace: ${OPENSHIFT_PROJECT}
        user: claw-workspace
      name: workspace
    current-context: workspace
    kind: Config
    users:
    - name: claw-workspace
      user:
        token: proxy-managed-token
